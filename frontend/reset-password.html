<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIFE,FIT 비밀번호 재설정</title>
  <link rel="icon" type="image/png" href="img/logo_B_day_circle.png">
  <link rel="icon" type="image/png" href="img/logo_B_night_circle.png" media="(prefers-color-scheme: dark)">

  <!-- 테마를 CSS 보다 먼저 정한다. index.html 과 같은 키를 읽어 낮/밤이 어긋나지 않게 한다 -->
  <script>
    (function () {
      const saved = localStorage.getItem("lifefit-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>

  <!-- signup.html 과 같은 일체형 페이지. 색 값도 그대로 옮겼다(style.css 를 통째로
       불러오면 지도·패널 레이아웃까지 따라온다) -->
  <style>
    :root {
      --bg: #FBF8F1; --surface: #FFFFFF; --surface-2: #F1E9CE; --line: #D7C39B;
      --text: #1C1A20; --text-muted: #6E6C60; --primary: #344E41; --danger: #C0563F;
      --accent-fill: #FFCC00; --accent-ink: #1C1A20;
    }
    [data-theme="dark"] {
      --bg: #2B2D2D; --surface: #5F6364; --surface-2: #414443; --line: #5F6364;
      --text: #B1B695; --text-muted: #7B7E7F; --primary: #869481; --danger: #E08A72;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6;
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      padding: 80px 20px;
    }
    .wrap { max-width: 380px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .lead { color: var(--text-muted); font-size: 13.5px; margin-bottom: 22px; }
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; padding: 22px 24px;
    }
    input {
      width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
      color: var(--text); background: var(--surface-2); border: 1px solid var(--line);
      border-radius: 8px; outline: none; margin-bottom: 10px;
    }
    input:focus { border-color: var(--primary); }
    button {
      width: 100%; padding: 11px; border: none; border-radius: 999px;
      background: var(--primary); color: var(--bg); font-size: 14px; font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: var(--accent-fill); color: var(--accent-ink); }
    .msg { font-size: 13px; color: var(--danger); margin-top: 10px; min-height: 1em; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>새 비밀번호 설정</h1>
    <p class="lead">메일로 받은 링크를 눌러 여기까지 왔다면, 새 비밀번호를 입력해 주세요.</p>
    <div class="card">
      <form id="resetForm">
        <input id="pw1" type="password" placeholder="새 비밀번호 (6자 이상)" autocomplete="new-password" required>
        <input id="pw2" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password" required>
        <button type="submit">비밀번호 바꾸기</button>
      </form>
      <p id="msg" class="msg"></p>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./lib/supabaseClient.js";

    const msgEl = document.getElementById("msg");

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;
      msgEl.textContent = "";

      if (pw1 !== pw2) {
        msgEl.textContent = "비밀번호가 서로 달라요. 다시 입력해 주세요.";
        return;
      }

      // 복구 링크를 타고 들어오면 Supabase SDK 가 URL 의 토큰을 읽어 세션을 이미
      // 만들어 둔다(detectSessionInUrl 기본값) — 그 세션으로 비밀번호만 갱신한다.
      const { error } = await supabase.auth.updateUser({ password: pw1 });
      if (error) {
        msgEl.textContent = "비밀번호 변경에 실패했어요. 링크가 만료됐을 수 있어요.";
        return;
      }
      alert("비밀번호를 바꿨어요. 이제 새 비밀번호로 로그인해 주세요.");
      location.href = "/";
    });
  </script>
</body>
</html>
