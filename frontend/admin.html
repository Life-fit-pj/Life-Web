<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>LIFE,FIT 관리자</title>
  <style>
    :root {
      --ink:    #1c1b22;   /* 본문 글자 */
      --muted:  #7c7a8a;   /* 흐린 글자 — 라벨, 부제 */
      --line:   #e2e0e8;   /* 테두리 */
      --bg:     #f6f5f8;   /* 화면 바탕 */
      --card:   #ffffff;   /* 카드 배경 */
      --accent: #4a44d6;   /* 강조 — 고른 행, 주요 버튼 */
    }

    body { font-family: sans-serif; margin: 0;
           color: var(--ink); background: var(--bg); }

    .tabs { display: flex; gap: 8px; padding: 10px; }
    .tab.on { font-weight: bold; text-decoration: underline; }

    .shell { display: flex; height: calc(100vh - 50px); }
    .shell[hidden] { display: none; }

    .side { width: 260px; overflow-y: auto; padding: 8px;
            border-right: 1px solid var(--line); background: var(--card); }
    .row { padding: 8px 10px; cursor: pointer; border-radius: 8px; }
    .row:hover { background: var(--bg); }
    .row.on { background: var(--accent); color: #fff; font-weight: bold; }

    main { flex: 1; padding: 16px; overflow-y: auto; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .wide { grid-column: 1 / -1; }

    .card { background: var(--card); border: 1px solid var(--line);
            border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
    .card-title { font-size: 13px; color: var(--muted);
                  letter-spacing: .05em; margin-bottom: 12px; }

    #toast { position: fixed; right: 20px; bottom: 20px;
             background: var(--ink); color: #fff;
             padding: 12px 18px; border-radius: 8px; }
    #toast[hidden] { display: none; }
    .meter { height: 6px; background: rgba(0,0,0,.07);
         border-radius: 99px; overflow: hidden; }
    .meter i { display: block; height: 100%; background: var(--accent); }
    .err { color: #d63b30; font-size: 11.5px; margin-top: 4px; }
    #status { padding: 6px 12px; font-size: 12px; }
    #status.ok { color: #2f8f5b; }
    #status.bad { color: #d63b30; font-weight: bold; }
  </style>
</head>
<body>

  <div id="toast" hidden></div>

  <div id="status">…</div>
  <button onclick="clearCache()">캐시 비우기</button>

  <!-- 4-3에서 여기에 탭·목록·폼 화면을 채운다 -->
  <div class="tabs">

  <!-- 4-3에서 여기에 탭·목록·폼 화면을 채운다 -->
  <div class="tabs">
    <button class="tab" data-tab="member" onclick="showTab('member')">회원</button>
    <button class="tab" data-tab="region" onclick="showTab('region')">행정동</button>
  </div>

  <div class="shell" id="view-member">
    <aside class="side">
      <input id="member-search" placeholder="이름 검색" oninput="filterMembers()">
      <div id="member-rows"></div>
    </aside>
    <main id="member-board">
      <div class="empty">회원을 선택하세요</div>
    </main>
  </div>

  <div class="shell" id="view-region" hidden>
    <aside class="side">
      <input id="region-search" placeholder="동 이름 검색" oninput="filterRegions()">
      <div id="region-rows"></div>
    </aside>
    <main id="region-board">
      <div class="empty">행정동을 선택하세요</div>
    </main>
  </div>

  <script>
    const API_BASE = '/api/admin';

    // 토큰은 한 번 물어보고 localStorage 에 저장해 다음부터는 안 물어본다
    let TOKEN = localStorage.getItem('adminToken') || prompt('관리자 토큰을 입력하세요') || '';
    if (TOKEN) localStorage.setItem('adminToken', TOKEN);

    // 모든 요청이 이 함수를 지난다. 6단계에서 토큰을 붙일 때도 여기 한 줄만 고치면 된다
    const api = async (path, options = {}) => {
      const res = await fetch(API_BASE + path, {
        ...options,
        headers: { 'Authorization': 'Bearer ' + TOKEN, ...options.headers },
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    };

    // HTML 로 해석될 글자를 막는다
    const esc = s => (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.hidden = false;
      setTimeout(() => { el.hidden = true; }, 1800);
    }

    function field(label, name, value, {type = 'input', options = null, wide = false} = {}) {
      const box = options
        ? `<select name="${name}">${options.map(o =>
            `<option ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
        : type === 'textarea'
          ? `<textarea name="${name}">${esc(value ?? '')}</textarea>`
          : `<input name="${name}" value="${esc(String(value ?? ''))}"
               ${type === 'number' ? 'type="number" min="0"' : ''}>`;
      return `<div class="${wide ? 'wide' : ''}">
        <label>${label}</label>${box}<div class="err" data-err="${name}"></div></div>`;
    }

    let membersLoaded = false;
    let regionsLoaded = false;

    function showTab(name) {
      document.getElementById('view-member').hidden = name !== 'member';
      document.getElementById('view-region').hidden = name !== 'region';
      document.querySelectorAll('.tab').forEach(t =>
        t.classList.toggle('on', t.dataset.tab === name));

      if (name === 'member' && !membersLoaded) loadMembers();
      if (name === 'region' && !regionsLoaded) loadRegions();
    }


    async function clearCache() {
      await api('/cache/clear', { method: 'POST' });
      await refreshStatus();          // 비운 걸 화면에 바로 반영
      toast('캐시를 비웠다');
    }


    async function refreshStatus() {
      const box = document.getElementById('status');
      try {
        const s = await api('/ready');
        box.textContent = s.ok
          ? `정상 · 행정동 ${s.regions}개 · 회원 ${s.members}명 · 캐시 ${s.cache_warm ? '있음' : '비어 있음'}`
          : `문제 있음: ${s.error ?? '데이터 없음'}`;
        box.className = s.ok ? 'ok' : 'bad';
      } catch (e) {
        box.textContent = '서버에 연결할 수 없음';
        box.className = 'bad';
      }
    }


    // 회원목록
    let members = [];
    let currentMember = null;      // 지금 고른 회원의 customer_id. 아직 없으면 null

    async function loadMembers() {
      members = await api('/members');
      membersLoaded = true;
      renderMemberRows(members);
    }

    function renderMemberRows(list) {
      document.getElementById('member-rows').innerHTML = list.map(m => `
        <div class="row ${m.customer_id === currentMember ? 'on' : ''}"
             data-id="${m.customer_id}"
             onclick="openMember('${m.customer_id}')">
          ${esc(m.customer_id)} ${esc(m.name)}
        </div>`).join('');
    }

    // 지금 화면에 떠 있는 행들 중, 고른 것에만 'on' 을 붙이고 나머지는 뗀다.
    // 목록을 다시 그리지 않으므로 검색으로 걸러 놓은 상태가 유지된다
    function markCurrentRow() {
      document.querySelectorAll('#member-rows .row').forEach(el => {
        el.classList.toggle('on', el.dataset.id === currentMember);
      });
    }

    function filterMembers() {
      const q = document.getElementById('member-search').value.trim();
      renderMemberRows(members.filter(m => (m.name + m.customer_id).includes(q)));
    }

    // 회원 한 명 상세
    async function openMember(id) {
      currentMember = id;
      markCurrentRow();              // ← 다시 그리지 않고 표시만 옮긴다

      const data = await api('/members/' + id);
      const { customer, preferences, persona } = data;

      const customerFields = Object.entries(customer)
        .filter(([k]) => k !== 'customer_id')
        .map(([k, v]) => field(k, k, v)).join('');

      const prefFields = Object.entries(preferences)
        .map(([k, v]) => field(k, k, v, { type: 'number' })).join('');

      const personaFields = Object.entries(persona)
        .map(([k, v]) => field(k, k, v, { type: 'textarea', wide: true })).join('');

      document.getElementById('member-board').innerHTML = `
        <h3>${esc(customer.customer_id)} ${esc(customer.name)}</h3>

        <div class="card">
          <div class="card-title">기본 정보</div>
          <div class="grid">${customerFields}</div>
        </div>

        <div class="card">
          <div class="card-title">희망 조건 (가중치 1~5)</div>
          <div class="grid">${prefFields}</div>
        </div>

        <div class="card">
          <div class="card-title">페르소나 — 이 글을 고치면 벡터가 다시 만들어진다</div>
          <div class="grid">${personaFields}</div>
        </div>

        <button onclick="saveMember('${customer.customer_id}')">저장</button>
        <button onclick="previewMember('${customer.customer_id}')">추천 돌려보기</button>
        <button onclick="showSimilar('${customer.customer_id}')">비슷한 회원</button>

        <div id="preview"></div>
        <div id="similar"></div>
      `;
    }

    async function saveMember(id) {
      const inputs = document.querySelectorAll('#member-board input, #member-board textarea');
      const patch = {};
      inputs.forEach(el => {
        patch[el.name] = el.type === 'number' ? Number(el.value) : el.value;
      });

      // ② 저장하기 "전"의 추천을 먼저 받아 둔다 — 순서를 바꾸면 비교 대상이 사라진다
      const before = await api(`/members/${id}/preview`);

      // ③ 저장 — 값이 규칙에 어긋나면 422 가 오고, 칸마다 이유가 붙어 온다
      clearErrors();
      try {
        await api('/members/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(patch),
        });
      } catch (e) {
        return showErrors(e);        // 저장 실패 — 아래 ④⑤ 를 하면 안 된다
      }


    function clearErrors() {
      document.querySelectorAll('[data-err]').forEach(el => { el.textContent = ''; });
    }

    function showErrors(e) {
      let detail;
      try {
        detail = JSON.parse(e.message).detail;
      } catch {
        return toast('저장 실패: ' + e.message);   // 404 처럼 detail 이 문자열인 경우
      }
      if (typeof detail !== 'object') return toast('저장 실패: ' + detail);

      for (const [name, message] of Object.entries(detail)) {
        const box = document.querySelector(`[data-err="${name}"]`);
        if (box) box.textContent = message;
      }
      toast('값이 올바르지 않다');
    }

    
      // ④ 저장 "후"의 추천. 캐시는 서버가 이미 비웠으므로 새 값 기준으로 계산된다
      const after = await api(`/members/${id}/preview`);

      members = await api('/members');
      renderMemberRows(members);
      await openMember(id);           // ★ await — 판을 다 그릴 때까지 기다린다
      renderDiff(before, after);      // 그 다음에 그려야 안 지워진다
      toast('저장했다');
    }



    async function previewMember(id) {
      const box = document.getElementById('preview');
      box.textContent = '계산 중…';        // 몇 초 걸릴 수 있다

      const regions = await api(`/members/${id}/preview`);

      box.innerHTML = `
        <div class="card">
          <div class="card-title">이 회원 조건으로 뽑은 TOP 5</div>
          ${regions.map((r, i) =>
            `<div>${i + 1}위 ${esc(r.name)} — ${r.total}점</div>`).join('')}
        </div>`;
    }


    async function showSimilar(id) {
      const box = document.getElementById('similar');
      box.textContent = '벡터에서 찾는 중…';

      const list = await api(`/members/${id}/similar`);

      box.innerHTML = `
        <div class="card">
          <div class="card-title">페르소나가 비슷한 회원</div>
          ${list.map(s => {
            const found = members.find(m => m.customer_id === s.customer_id);
            const name = found ? found.name : '';
            return `<div>
              <b>${esc(s.customer_id)} ${esc(name)}</b>
              <span style="color:var(--muted)"> · ${s.score} · ${esc(s.category)}</span>
              <div style="font-size:12px">${esc(s.text)}</div>
            </div>`;
          }).join('')}
        </div>`;
    }


    function renderDiff(before, after) {
      const beforeNames = before.map(r => r.name);

      const rows = after.map((r, i) => {
        const was = beforeNames.indexOf(r.name);          // 전에는 몇 위였나 (없으면 -1)
        const mark = was === -1 ? 'NEW'
                   : was === i  ? '—'
                   : was > i    ? `▲${was - i}`
                                : `▼${i - was}`;
        return `<div>${i + 1}위 ${esc(r.name)} — ${r.total}점 <b>${mark}</b></div>`;
      });

      document.getElementById('preview').innerHTML = `
        <div class="card">
          <div class="card-title">저장 전 → 후 순위 변화</div>
          ${rows.join('')}
        </div>`;
    }


    // 행정동
    let regions = [];

    async function loadRegions() {
      regions = await api('/regions');
      regionsLoaded = true;
      renderRegionRows(regions);
    }

    function renderRegionRows(list) {
      document.getElementById('region-rows').innerHTML = list.map(r => `
        <div class="row" onclick="openRegion('${r.구}', '${r.행정동명}')">
          ${esc(r.구)} ${esc(r.행정동명)}
        </div>`).join('');
    }

    function filterRegions() {
      const q = document.getElementById('region-search').value.trim();
      renderRegionRows(regions.filter(r => (r.구 + r.행정동명).includes(q)));
    }

    async function openRegion(gu, dong) {
      const data = await api(`/regions/${gu}/${dong}`);

      const fields = Object.entries(data.values).map(([k, v]) => {
        const pct = data.percentiles[k];
        // 백분위 92 = 427개 동 중 위에서 8% 안에 든다는 뜻
        const label = pct === null ? k : `${k} · 상위 ${100 - pct}%`;
        return `<div>${field(label, k, v, { type: 'number' })}${meter(pct ?? 0)}</div>`;
      }).join('');

      document.getElementById('region-board').innerHTML = `
        <h3>${esc(data.구)} ${esc(data.행정동명)}</h3>
        <div class="grid">${fields}</div>
        <button onclick="saveRegion('${data.구}', '${data.행정동명}')">저장</button>
      `;
    }


    async function saveRegion(gu, dong) {
      const inputs = document.querySelectorAll('#region-board input');
      const patch = {};
      inputs.forEach(el => { patch[el.name] = Number(el.value); });

      await api(`/regions/${gu}/${dong}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });

      openRegion(gu, dong);
      toast('저장했다');            // 수정
    }

    function meter(percent) {
      return `<div class="meter"><i style="width:${percent}%"></i></div>`;
    }

    showTab('member');
    refreshStatus();
  </script>

</body>
</html>
